app = "verity-runner"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # the runner stops itself when idle (RUNNER_IDLE_EXIT_MS)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Each machine runs up to RUNNER_MAX_JOBS (2) browser jobs. soft_limit 1 makes
# Fly's proxy spread jobs across machines (auto-starting stopped ones) before
# doubling up; past 2 the runner itself answers 503 + Retry-After and the app
# queues the request (lib/runner-fetch.ts) instead of failing the user.
[http_service.concurrency]
  type = "requests"
  soft_limit = 1
  hard_limit = 3

[env]
  RUNNER_MAX_JOBS = "2"
  RUNNER_WORKERS = "2"
  RUNNER_SUITE_BUDGET_MS = "200000"
  RUNNER_IDLE_EXIT_MS = "300000"

# Exit 0 (idle self-stop) leaves the machine stopped; crashes restart it.
[[restart]]
  policy = "on-failure"
  retries = 3
