app = "verity-runner"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# One customer job per machine. When a machine is busy, Fly's proxy routes the
# next request to another (auto-started) machine instead of sharing this one.
[http_service.concurrency]
  type = "requests"
  soft_limit = 1
  hard_limit = 1
