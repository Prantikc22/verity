    <div
      id="hook-01-ground"

    ></div>

    <div
      id="hook-01-stage"
      class="clip"
      data-start="0"
      data-duration="5.4"
      data-track-index="1"
    >
      <!-- Scene 1 -->
      <div id="hook-01-line1" class="hook-01-line">
        <span class="hook-01-word">you</span>
        <span class="hook-01-word">shipped</span>
        <span class="hook-01-word">a</span>
        <span class="hook-01-word">change.</span>
      </div>

      <!-- Scene 2: fixed line, only the slot changes -->
      <div id="hook-01-line2" class="hook-01-line">is <span id="hook-01-slot">checkout</span> still working?</div>

      <!-- Scene 3: hero payoff -->
      <div id="hook-01-hero">
        <span class="hook-01-heroline" id="hook-01-hero-a">did anything</span>
        <span class="hook-01-heroline" id="hook-01-hero-b"><span id="hook-01-hero-accent">break?</span></span>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const FRAME_ID = "01-hook";
        const DURATION = 5;
        const T_LINE2 = 1.2;
        const T_HERO = 3.4;

        const tl = gsap.timeline({ paused: true });

        const line1 = document.getElementById("hook-01-line1");
        const line2 = document.getElementById("hook-01-line2");
        const slot = document.getElementById("hook-01-slot");
        const hero = document.getElementById("hook-01-hero");
        const heroA = document.getElementById("hook-01-hero-a");
        const heroB = document.getElementById("hook-01-hero-b");
        const stage = document.getElementById("hook-01-stage");

        // Base visibility states (explicit at t=0, seek-safe)
        tl.set(line1, { autoAlpha: 1 }, 0);
        gsap.set(line2, { autoAlpha: 0 });
        gsap.set(hero, { autoAlpha: 0 });

        // Scene 1 (0.0–1.2): word-by-word rise
        const words = line1.querySelectorAll(".hook-01-word");
        words.forEach(function (w, i) {
          tl.fromTo(
            w,
            { y: 46, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            0.05 + i * 0.12
          );
        });

        // Scene 2 (1.2–3.4): hard cut to the fixed question line
        tl.set(line1, { autoAlpha: 0 }, T_LINE2);
        tl.set(line2, { autoAlpha: 1 }, T_LINE2);

        // In-place token swap — discrete text states, reverse-searched each update
        const SEQUENCE = [
          { t: 0.0, text: "checkout" },
          { t: 1.95, text: "sign-up" },
          { t: 2.65, text: "billing" },
        ];
        function textAt(time) {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return SEQUENCE[0].text;
        }
        const driver = { t: 0 };
        tl.fromTo(
          driver,
          { t: 0 },
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              slot.textContent = textAt(driver.t);
            },
          },
          0
        );

        // Under-the-swap camera: a slow, barely-there push on the stage
        tl.fromTo(
          stage,
          { scale: 1 },
          { scale: 1.035, duration: T_HERO - T_LINE2, ease: "none" },
          T_LINE2
        );

        // Scene 3 (3.4–5.0): line clears, hero lands with a pop-settle and holds
        tl.set(line2, { autoAlpha: 0 }, T_HERO);
        tl.set(stage, { scale: 1 }, T_HERO);
        tl.set(hero, { autoAlpha: 1 }, T_HERO);
        tl.fromTo(
          heroA,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          T_HERO
        );
        tl.fromTo(
          heroB,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          T_HERO + 0.1
        );

        // Pad the timeline to the full frame length (hold to the cut)
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
    </script>
