      // ---- Scene 1 (0.0-1.0): headline + panel with five pending rows ----
      tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.0);
      var words = $("head").children;
      for (var w = 0; w < words.length; w++) {
        tl.fromTo(words[w], { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05 + w * 0.07);
      }
      tl.fromTo($("phead"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.15);
      var rowIds = ["row0", "row1", "row2", "row3", "row4"];
      for (var r = 0; r < 5; r++) {
        tl.fromTo($(rowIds[r]), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0.3 + r * 0.09);
      }

      // initial hidden states for result elements (fromTo-set at t=0, seek-safe)
      var hideIds = ["ico0","ico1","ico2","ico3","ico4","data0","data1","data2","data3","data4",
                     "pres0","pres1","pres2","pres3","pres4","tint1","tint2","pstat-done",
                     "cf0","cf1","cf2","flakytxt","call1","call2"];
      for (var h = 0; h < hideIds.length; h++) tl.set($(hideIds[h]), { opacity: 0 }, 0);
      tl.set([$("lead1"), $("lead2")], { scaleX: 0, transformOrigin: "0% 50%" }, 0);
      // anchored expand: sheet + below tucked up by the sheet height
      tl.set([$("sheet"), $("below")], { y: -64 }, 0);
      tl.set($("evtxt"), { clipPath: "inset(0% 100% 0% 0%)" }, 0);

      // working-state spinners: finite, timeline-driven, die exactly at resolve
      var RES = [1.1, 2.45, 3.0, 3.8, 4.6];
      for (var s = 0; s < 5; s++) {
        tl.fromTo($("spin" + s), { rotation: 0 }, { rotation: 360 * Math.round(RES[s] * 1.5), transformOrigin: "50% 50%", duration: RES[s], ease: "none" }, 0);
      }
      tl.fromTo($("hspin"), { rotation: 0 }, { rotation: 360 * 7, transformOrigin: "50% 50%", duration: 5.0, ease: "none" }, 0);

      // ---- Scene 2 (1.0-5.2): rows resolve top to bottom ----
      function resolve(i, t, tintId) {
        tl.to($("spin" + i), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%", duration: 0.14, ease: "power2.in" }, t);
        tl.fromTo($("ico" + i), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.4)" }, t + 0.08);
        tl.to($("skel" + i), { opacity: 0, duration: 0.15 }, t);
        tl.to($("prun" + i), { opacity: 0, duration: 0.14 }, t);
        tl.fromTo($("pres" + i), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, transformOrigin: "100% 50%", duration: 0.36, ease: "back.out(2)" }, t + 0.1);
        if (tintId) tl.fromTo($(tintId), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, t + 0.05);
      }

      // row 0 - pass
      resolve(0, RES[0]);
      tl.fromTo($("data0"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, RES[0] + 0.05);

      // row 1 - flaky: the three attempts fill in sequence, then the verdict lands
      tl.to($("skel1"), { opacity: 0, duration: 0.15 }, 1.75);
      tl.set($("data1"), { opacity: 1 }, 1.8);
      var cf = ["cf0", "cf1", "cf2"];
      for (var c = 0; c < 3; c++) {
        tl.fromTo($(cf[c]), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.28, ease: "back.out(2.6)" }, 1.8 + c * 0.22);
      }
      resolve(1, RES[1], "tint1");
      tl.fromTo($("flakytxt"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, RES[1] + 0.05);

      // row 2 - real failure
      resolve(2, RES[2], "tint2");
      tl.fromTo($("data2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, RES[2] + 0.05);

      // row 3 - load
      resolve(3, RES[3]);
      tl.fromTo($("data3"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, RES[3] + 0.05);

      // row 4 - security
      resolve(4, RES[4]);
      tl.fromTo($("data4"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, RES[4] + 0.05);

      // header tense flip: running -> complete
      tl.to($("pstat-run"), { opacity: 0, duration: 0.15 }, 5.0);
      tl.fromTo($("pstat-done"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.05);

      // ---- Scene 3 (5.2-6.6): flaky callout, then the red row expands ----
      tl.fromTo($("lead1"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, 5.3);
      tl.fromTo($("call1"), { opacity: 0, x: -24, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, transformOrigin: "0% 50%", duration: 0.42, ease: "back.out(1.8)" }, 5.4);

      tl.fromTo([$("sheet"), $("below")], { y: -64 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 5.85);
      tl.fromTo($("evtxt"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(20)" }, 6.15);

      // ---- Scene 4 (6.6-8.0): evidence callout pins to the red row; hold ----
      tl.fromTo($("lead2"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, 6.7);
      tl.fromTo($("call2"), { opacity: 0, x: -24, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, transformOrigin: "0% 50%", duration: 0.42, ease: "back.out(1.8)" }, 6.8);

      tl.set({}, {}, 8);
      window.__timelines = window.__timelines || {};
      window.__timelines["06-pr-verdict"] = tl;
    })();
  </script>
</div>
</template>
