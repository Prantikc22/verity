<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050608;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="48"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-paste-url"
        class="scene"
        data-composition-id="02-paste-url"
        data-composition-src="compositions/frames/02-paste-url.html"
        data-start="5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-writes-playwright"
        class="scene"
        data-composition-id="03-writes-playwright"
        data-composition-src="compositions/frames/03-writes-playwright.html"
        data-start="10"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-every-layer"
        class="scene"
        data-composition-id="04-every-layer"
        data-composition-src="compositions/frames/04-every-layer.html"
        data-start="17"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-commit-workflow"
        class="scene"
        data-composition-id="05-commit-workflow"
        data-composition-src="compositions/frames/05-commit-workflow.html"
        data-start="23"
        data-duration="6.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-pr-verdict"
        class="scene"
        data-composition-id="06-pr-verdict"
        data-composition-src="compositions/frames/06-pr-verdict.html"
        data-start="29"
        data-duration="8.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-trust"
        class="scene"
        data-composition-id="07-trust"
        data-composition-src="compositions/frames/07-trust.html"
        data-start="37"
        data-duration="5.6"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="42"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- BGM: the library track is 30s, so a second copy crossfades in at 26s
           (opposing 4s volume envelopes) and the bed fades out over the last 3s. -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1,"v":1},{"t":26,"v":1},{"t":30,"v":0}]}]}'
      ></audio>
      <audio
        id="el-bgm-2"
        src="assets/bgm/track.mp3"
        data-start="26"
        data-media-start="4"
        data-duration="22"
        data-track-index="12"
        data-volume="0.9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":4,"v":1},{"t":19,"v":1},{"t":22,"v":0}]}]}'
      ></audio>

      <!-- SFX: ticks on frame 1's word swaps (1.95s, 2.65s); impact as "did anything break?" lands (3.4s) -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/soft-tick-on-each-swap.mp3"
        data-start="1.95"
        data-duration="0.768"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-0b"
        src="assets/sfx/soft-tick-on-each-swap.mp3"
        data-start="2.65"
        data-duration="0.768"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/low-impact-on-the-last-line.mp3"
        data-start="3.4"
        data-duration="1.834"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-paste-url", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-paste-url", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-writes-playwright", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-writes-playwright", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.fromTo("#el-04-every-layer", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.to("#el-04-every-layer", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-05-commit-workflow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-05-commit-workflow", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 29);
        tl.fromTo("#el-06-pr-verdict", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 29);
        tl.to("#el-06-pr-verdict", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 37);
        tl.fromTo("#el-07-trust", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 37);
        tl.to("#el-07-trust", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 42);
        tl.fromTo("#el-08-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 42);
        tl.to({}, { duration: 48 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
