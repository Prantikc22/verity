<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyGreenhouse — Verity MCP demo app</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #111; }
      header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; }
      nav a { margin-left: 12px; color: #4f46e5; text-decoration: none; }
      input { display: block; width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
      button { cursor: pointer; padding: 8px 14px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; }
      .muted { color: #666; font-size: 14px; }
      [hidden] { display: none; }
      .item { padding: 8px; border: 1px solid #eee; margin-top: 6px; }
      .ok { color: #059669; font-weight: 600; }
      .err { color: #dc2626; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <strong>🌱 MyGreenhouse</strong>
      <nav><a href="#" id="nav-home">Home</a><a href="#" id="nav-logout" hidden>Log out</a></nav>
    </header>

    <!-- Login -->
    <main id="login">
      <h1>Sign in</h1>
      <p class="muted">Demo credentials — <b>username:</b> gardener &nbsp; <b>password:</b> Greenhouse123</p>
      <label for="username">Username</label>
      <input id="username" aria-label="Username" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" aria-label="Password" autocomplete="current-password" />
      <button id="signin">Sign in</button>
      <p id="login-error" class="err" role="alert" hidden>Invalid username or password</p>
    </main>

    <!-- App (after login) -->
    <main id="dashboard" hidden>
      <h1>Your plants</h1>
      <p class="ok" role="status">Welcome back, gardener!</p>
      <label for="plant">Add a plant</label>
      <input id="plant" aria-label="Plant name" placeholder="e.g. Basil" />
      <button id="add">Add plant</button>
      <div id="list" aria-label="Plant list"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      $("signin").addEventListener("click", () => {
        const u = $("username").value, p = $("password").value;
        if (u === "gardener" && p === "Greenhouse123") {
          $("login").hidden = true; $("dashboard").hidden = false; $("nav-logout").hidden = false; $("login-error").hidden = true;
        } else {
          $("login-error").hidden = false;
        }
      });
      $("add").addEventListener("click", () => {
        const name = $("plant").value.trim();
        if (!name) return;
        const el = document.createElement("div");
        el.className = "item"; el.textContent = name; el.setAttribute("role", "listitem");
        $("list").appendChild(el); $("plant").value = "";
      });
      $("nav-logout").addEventListener("click", (e) => {
        e.preventDefault();
        $("dashboard").hidden = true; $("login").hidden = false; $("nav-logout").hidden = true;
        $("username").value = ""; $("password").value = ""; $("list").innerHTML = "";
      });
    </script>
  </body>
</html>
