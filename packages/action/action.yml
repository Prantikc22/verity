name: "Verity"
description: "AI-augmented testing: UI/API + Visual (Playwright), Agent/LLM evals, Performance (k6 + Lighthouse), Security (ZAP+Semgrep), API contract (Schemathesis). Runs in YOUR CI; reports to Verity."
author: "QAShift"
branding:
  icon: "check-circle"
  color: "purple"
inputs:
  # ---- core (unchanged) ----
  tier:
    description: "'fast' (Quick check / smoke, diff-aware) or 'full' (Full regression / load)."
    required: false
    default: "fast"
  token:
    description: "Verity ingest token (store as a secret)."
    required: true
  base:
    description: "Base ref for diff-aware selection on the fast tier."
    required: false
    default: "origin/main"
  api-url:
    description: "Verity API base URL."
    required: false
    default: "https://verity-kappa-ebon.vercel.app"
  # ---- discipline selection ----
  engines:
    description: "Comma-separated engines to run: ui,api,visual,agent,perf,security,contract. Default 'ui' keeps existing behavior."
    required: false
    default: "ui"
  # ---- visual (Playwright screenshot regression) ----
  visual-snapshots-dir:
    description: "Directory of Playwright visual specs + committed baseline screenshots."
    required: false
    default: "tests/verity/visual"
  visual-max-diff-ratio:
    description: "Allowed pixel drift (0-1) before a snapshot counts as changed."
    required: false
    default: "0.01"
  # ---- agent (LLM / AI-feature evals) ----
  agent-endpoint:
    description: "Reachable HTTP endpoint of your AI feature under eval."
    required: false
    default: ""
  agent-token:
    description: "Secret token used to authenticate eval calls to the AI endpoint."
    required: false
    default: ""
  grader-api-key:
    description: "API key for AI-graded eval checks (any OpenAI-compatible provider). Only needed if your eval suite uses rubric checks."
    required: false
    default: ""
  grader-base-url:
    description: "Base URL of the OpenAI-compatible grader API. Empty = OpenAI."
    required: false
    default: ""
  grader-model:
    description: "Model that grades rubric checks."
    required: false
    default: "gpt-4o-mini"
  # ---- performance (k6 named profiles / Lighthouse) ----
  perf-config:
    description: "Path to the AI-generated load-test script (one script, every profile)."
    required: false
    default: "tests/verity/perf/verity.k6.js"
  perf-profile:
    description: "Load profile to run: smoke|load|stress|spike|soak|breakpoint. Empty ⇒ derived from tier (fast=smoke, full=load)."
    required: false
    default: ""
  lighthouse-url:
    description: "If set, run Lighthouse CI against this URL for Core Web Vitals (optional, separate from k6)."
    required: false
    default: ""
  # ---- security (ZAP DAST + Semgrep SAST) ----
  security-target-url:
    description: "Reachable preview/staging URL for the ZAP DAST scan."
    required: false
    default: ""
  # ---- shared API inputs (reused by contract + perf; NO second upload) ----
  openapi-spec:
    description: "Path or URL to the OpenAPI spec (reused for Schemathesis and API-driven load setup)."
    required: false
    default: ""
  api-base-url:
    description: "Reachable base URL of the API under test (required for Schemathesis to execute)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # ============================ UI + API flow (existing, UNCHANGED) ===========
    # The vendored Playwright runner. Runs whenever 'ui' or 'api' is selected.
    - name: "Verity — UI/API (Playwright)"
      if: contains(inputs.engines, 'ui') || contains(inputs.engines, 'api')
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node "${{ github.action_path }}/verity.mjs" run --tier "${{ inputs.tier }}" --base "${{ inputs.base }}"

    # ============================ VISUAL (screenshot regression) ================
    # Playwright visual specs (toHaveScreenshot) diffed against baselines committed
    # in YOUR repo. The runner runs Playwright itself; no tool is named in your CI.
    - name: "Verity — Visual (screenshot regression)"
      if: contains(inputs.engines, 'visual')
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_VISUAL_SNAPSHOTS_DIR: ${{ inputs.visual-snapshots-dir }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" visual --tier "${{ inputs.tier }}"

    # ============================ AGENT (LLM / AI-feature evals) =================
    # Playwright API evals (tests/verity/agent/*.spec.ts) and/or the scored eval
    # suite (tests/verity/agent/verity.evals.yaml) — merged into one agent run.
    # Full regression asks each suite case 3x so inconsistent answers read as flaky.
    - name: "Verity — Agent (AI) evals"
      if: contains(inputs.engines, 'agent')
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        AGENT_ENDPOINT: ${{ inputs.agent-endpoint }}
        AI_API_TOKEN: ${{ inputs.agent-token }}
        VERITY_AGENT_EVALS_DIR: tests/verity/agent
        VERITY_GRADER_API_KEY: ${{ inputs.grader-api-key }}
        VERITY_GRADER_BASE_URL: ${{ inputs.grader-base-url }}
        VERITY_GRADER_MODEL: ${{ inputs.grader-model }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" agent --tier "${{ inputs.tier }}"

    # ============================ PERFORMANCE (k6 profiles) =====================
    # fast ⇒ smoke profile on every PR; full ⇒ your chosen profile on merge.
    # One script runs every profile; the runner invokes k6 itself and posts the
    # summary. No tool is named in YOUR workflow — only "perf".
    - name: "Verity — Performance (load profiles)"
      if: contains(inputs.engines, 'perf')
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_TARGET_URL: ${{ inputs.api-base-url }}
        VERITY_PERF_PROFILE: ${{ inputs.perf-profile }}
        VERITY_PERF_CONFIG: ${{ inputs.perf-config }}
      run: |
        set -e
        # Install k6 if the runner doesn't have it (self-contained, no external action).
        if ! command -v k6 >/dev/null 2>&1; then
          K6_VER=v0.54.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VER}/k6-${K6_VER}-linux-amd64.tar.gz" | tar xz
          sudo mv k6-*/k6 /usr/local/bin/ 2>/dev/null || mv k6-*/k6 /usr/local/bin/
        fi
        node "${{ github.action_path }}/verity-engines.mjs" k6 --tier "${{ inputs.tier }}"

    # ---- optional Lighthouse CI (Core Web Vitals) — separate, lightweight ------
    - name: "Verity — Performance (Lighthouse CWV)"
      if: contains(inputs.engines, 'perf') && inputs.lighthouse-url != ''
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_TARGET_URL: ${{ inputs.lighthouse-url }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" lighthouse --tier "${{ inputs.tier }}"

    # ============================ SECURITY (Docker: Python runtime) =============
    # SAST — Semgrep CE via the official Docker image (CLI subprocess only; never
    # linked into our code → clear of LGPL-2.1). Diff on PR, full repo on schedule.
    - name: "Verity — Security SAST (Semgrep)"
      if: contains(inputs.engines, 'security')
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_BASE_REF: ${{ inputs.base }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" security-sast --tier "${{ inputs.tier }}" --base "$VERITY_BASE_REF"

    # DAST — OWASP ZAP via Docker. Baseline scan on PR, full active scan on merge.
    - name: "Verity — Security DAST (ZAP)"
      if: contains(inputs.engines, 'security') && inputs.security-target-url != ''
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_TARGET_URL: ${{ inputs.security-target-url }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" security-dast --tier "${{ inputs.tier }}"

    # ============================ API CONTRACT (Docker: Schemathesis) ===========
    # Property-based contract testing, parallel to the existing Playwright flow
    # tests. Needs a reachable base URL to execute (internal APIs: customer CI only).
    - name: "Verity — API contract (Schemathesis)"
      if: contains(inputs.engines, 'contract') && inputs.openapi-spec != '' && inputs.api-base-url != ''
      shell: bash
      env:
        VERITY_INGEST_TOKEN: ${{ inputs.token }}
        VERITY_API_URL: ${{ inputs.api-url }}
        VERITY_PR_NUMBER: ${{ github.event.pull_request.number }}
        VERITY_OPENAPI_SPEC: ${{ inputs.openapi-spec }}
        VERITY_TARGET_URL: ${{ inputs.api-base-url }}
      run: |
        set -e
        node "${{ github.action_path }}/verity-engines.mjs" contract --tier "${{ inputs.tier }}"
